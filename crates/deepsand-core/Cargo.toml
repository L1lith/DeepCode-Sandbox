[package]
name = "deepsand-core"
description = "Sandbox planning, permission brokering and container orchestration for Deepsand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "deepsand_core"
path = "src/lib.rs"

[[bin]]
name = "deepsandctl"
path = "src/bin/deepsandctl.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
directories.workspace = true
dunce.workspace = true
sha2.workspace = true
rand.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
portable-pty.workspace = true
regex.workspace = true
zeroize.workspace = true
base64 = "0.22"
chacha20poly1305.workspace = true
keyring.workspace = true
getrandom.workspace = true

# File identity for hard-link deduplication. `std` exposes the inode on Unix but keeps the
# Windows file index behind an unstable feature, so the one call that needs it is made here.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
